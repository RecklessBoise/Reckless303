name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DRECKLESS303_COPY_AFTER_BUILD=OFF
      - name: Build
        run: cmake --build build --config Release --target Reckless303_VST3 Reckless303_AU Reckless303_Standalone -- -quiet
      - name: Package
        run: |
          mkdir dist
          cp -R build/Reckless303_artefacts/Release/VST3/Reckless303.vst3 dist/
          cp -R build/Reckless303_artefacts/Release/AU/Reckless303.component dist/
          cp -R build/Reckless303_artefacts/Release/Standalone/Reckless303.app dist/
          codesign --force --deep -s - dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: Reckless303-macOS
          path: dist

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -B build -DRECKLESS303_COPY_AFTER_BUILD=OFF
      - name: Build
        run: cmake --build build --config Release --target Reckless303_VST3 Reckless303_Standalone
      - uses: actions/upload-artifact@v4
        with:
          name: Reckless303-Windows
          path: |
            build/Reckless303_artefacts/Release/VST3/Reckless303.vst3
            build/Reckless303_artefacts/Release/Standalone/Reckless303.exe
